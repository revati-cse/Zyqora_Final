# Zyqora model profiles. Each profile binds ONE .pte to ONE preprocessing contract and ONE output decoder.
# The runtime refuses a .pte whose output shape does not match its profile, so a decoder can never be
# applied to the wrong model. Relative paths are resolved against the project root.
#
# `active` is the production model. It stays on the ImageNet baseline until the waste model passes
#   python scripts/verify_waste_model.py           (on the Pi, with the real .pte)
# after which `python scripts/verify_waste_model.py --activate` switches `active` to waste_mobilenetv2.

active: imagenet_mobilenetv2
fallback: imagenet_mobilenetv2     # used by the station when the active model cannot be loaded

profiles:
  waste_mobilenetv2:
    description: "MobileNetV2 fine-tuned on Organic vs Recyclable (2 classes), FP32, XNNPACK"
    decoder: direct_classes
    pte: models/mobilenetv2_waste_fp32_xnnpack.pte
    contract: config/model_waste.json          # exact 224x224 resize, ImageNet mean/std, output [1, 2]
    classes: config/classes_waste.json         # index 0 Organic -> COMPOST, index 1 Recyclable -> RECYCLE
    sha256: null                               # pinned by scripts/verify_waste_model.py --activate on the Pi
    ecoguard:
      threshold: 0.95        # provisional candidate from VALIDATION data (review 10.85%, accepted acc. 98.71%)
      min_margin: 0.0
      require_top1_mapped: false
      calibrated: false      # validation-set threshold table only; not confirmed on independent data
      frozen: false
      note: >-
        Chosen from the team's validation-set threshold table, not from TEST. A high softmax score
        does NOT mean the item is Organic or Recyclable: the model has no Residual/unknown class and
        will force any item into one of its two classes.

  imagenet_mobilenetv2:
    description: "TorchVision MobileNetV2 IMAGENET1K_V1 (1000 classes) + MaterialWise mapping (baseline/fallback)"
    decoder: imagenet_mapping
    from_app_config: true      # pte, contract, labels, mapping and ecoguard come from config/app.yaml
