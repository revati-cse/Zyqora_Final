# Zyqora AI 4.0 object detector (stage 1 of the mixed-waste pipeline).
#
# The shipped weights are the PRETRAINED Ultralytics YOLO11n COCO-80 detector, exported
# without NMS by scripts/export_detector.py. They are NOT trained on waste: they find
# generic objects (bottle, cup, banana, book, cell phone, ...). Each box is cropped and
# classified by the MobileNetV2 waste model; the COCO label is only used as a material
# hint through config/detector_materials.yaml. Common waste items that COCO has no class
# for (cans, plastic bags, cardboard, crumpled paper, wrappers) are often MISSED; when
# nothing is found the whole image is classified instead (whole_image_fallback).
# Fine-tuning on a box-annotated waste dataset (e.g. TACO): scripts/train_detector.py.
#
# Every profile is a fixed input size. Choose with scripts/benchmark_detector.py and
# scripts/evaluate_detector.py on the device that will run it.

active: yolo11n_640

profiles:
  yolo11n_640:
    description: "YOLO11n COCO-80, 640x640, ExecuTorch XNNPACK"
    file: models/yolo11n_640_xnnpack.pte
    runtime: executorch
    imgsz: 640
    classes: config/detector_coco80.json
    sha256: 5e9e694e561b1d5a138545f59f5c22060aa710ae62ae68c8daab76902566dde2
    weights: "Ultralytics yolo11n.pt (assets v8.3.0, sha256 0ebbc80d4a76...)"
    license: "AGPL-3.0 (Ultralytics weights)"
    trained_on: "COCO 2017 (80 generic classes; not waste-specific)"

  yolo11n_320:
    description: "YOLO11n COCO-80, 320x320 (about 4x fewer pixels; misses more small objects), ExecuTorch XNNPACK"
    file: models/yolo11n_320_xnnpack.pte
    runtime: executorch
    imgsz: 320
    classes: config/detector_coco80.json
    sha256: d6e3d9399854a3bfc8def4abdee465f7497674f749e4721db1bff68698b2ffc0
    weights: "Ultralytics yolo11n.pt (assets v8.3.0, sha256 0ebbc80d4a76...)"
    license: "AGPL-3.0 (Ultralytics weights)"
    trained_on: "COCO 2017 (80 generic classes; not waste-specific)"

  yolo11n_640_onnx:
    description: "YOLO11n COCO-80, 640x640, ONNX Runtime CPU (needs: pip install onnxruntime)"
    file: models/yolo11n_640.onnx
    runtime: onnxruntime
    imgsz: 640
    classes: config/detector_coco80.json
    sha256: 080b81054ff536853b34f32bc4aab2d0635c5b3071ba3286134c427aefb67190
    weights: "Ultralytics yolo11n.pt (assets v8.3.0, sha256 0ebbc80d4a76...)"
    license: "AGPL-3.0 (Ultralytics weights)"
    trained_on: "COCO 2017 (80 generic classes; not waste-specific)"

  yolo11n_320_onnx:
    description: "YOLO11n COCO-80, 320x320, ONNX Runtime CPU (needs: pip install onnxruntime)"
    file: models/yolo11n_320.onnx
    runtime: onnxruntime
    imgsz: 320
    classes: config/detector_coco80.json
    sha256: 35fdbf95b1d8c82f447a455742bc79db013973b73b36b0f3d92912e895a6eadf
    weights: "Ultralytics yolo11n.pt (assets v8.3.0, sha256 0ebbc80d4a76...)"
    license: "AGPL-3.0 (Ultralytics weights)"
    trained_on: "COCO 2017 (80 generic classes; not waste-specific)"

settings:                       # defaults; the dashboard Settings page can override them (stored in SQLite)
  conf_threshold: 0.25          # minimum detector confidence for a box
  iou_threshold: 0.45           # NMS overlap threshold
  agnostic_nms: true            # one box per physical object even if two COCO classes fire (bottle + cup)
  max_detections: 20
  max_objects_classified: 12    # caps latency: each crop is one MobileNetV2 inference
  crop_padding: 0.08            # fraction of box size added on each side before cropping
  min_box_area_fraction: 0.002  # ignore boxes smaller than 0.2% of the image
  whole_image_fallback: true    # no detection -> classify the whole image as one item (marked as such)

materials: config/detector_materials.yaml
