# VoiceSort fixed instructions. Clips live in audio/<lang>/<key lower-case>.wav.
# Keys RECYCLE / COMPOST / RESIDUAL must match the actions used in config/mapping.json.
#
# TAMIL TEXT STATUS: drafted, NOT yet reviewed by a fluent Tamil speaker.
# Audio clips generated by scripts/generate_audio.py (espeak-ng) are placeholders;
# replace them with recordings by a native speaker before the demo where possible.

languages:
  en: English
  ta: Tamil

player: auto            # auto | aplay | paplay | pw-play | none
playback_timeout_s: 15

messages:
  RECYCLE:
    en: "Place this item in the recycling bin."
    ta: "இந்தப் பொருளை மறுசுழற்சித் தொட்டியில் போடவும்."
  COMPOST:
    en: "Place this item in the compost bin."
    ta: "இந்தப் பொருளை மக்கும் குப்பைத் தொட்டியில் போடவும்."
  RESIDUAL:
    en: "Place this item in the residual waste bin."
    ta: "இந்தப் பொருளை இதர குப்பைத் தொட்டியில் போடவும்."
  MANUAL_REVIEW:
    en: "Please ask a supervisor to check this item."
    ta: "இந்தப் பொருளைச் சரிபார்க்க மேற்பார்வையாளரை அழைக்கவும்."
  VERIFIED_CORRECT:
    en: "Sorting verified successfully."
    ta: "வகைப்படுத்தல் வெற்றிகரமாகச் சரிபார்க்கப்பட்டது."
  VERIFIED_INCORRECT:
    en: "Sorting was not correct. No points were awarded."
    ta: "வகைப்படுத்தல் சரியாக இல்லை. புள்ளிகள் வழங்கப்படவில்லை."
